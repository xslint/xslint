---
name: release
'on':
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - run: npm run coverage
      - name: Stamp the released version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          today="$(date +%F)"
          npm --no-git-tag-version version "${VERSION}"
          sed -i "s/what: '0\.0\.0'/what: '${VERSION}'/" src/version.js
          sed -i "s/when: '0000-00-00'/when: '${today}'/" src/version.js
      - name: Publish to npm via OIDC
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public
      - name: Set the GitHub release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/changelog-notes.js "${VERSION}" > notes.md
          gh release edit "${VERSION}" --title "${VERSION}" \
            --notes-file notes.md \
            || gh release create "${VERSION}" --title "${VERSION}" \
              --notes-file notes.md
      - name: Trigger the downstream release cascade
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          for repo in xslint/xslint-lsp xslint/xslint-action; do
            printf '{"event_type":"xslint-released","client_payload":{"version":"%s"}}' \
              "${VERSION}" | gh api -X POST "repos/${repo}/dispatches" --input -
          done
