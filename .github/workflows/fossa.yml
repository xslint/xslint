---
name: fossa
'on':
  push:
    branches:
      - master
concurrency:
  group: fossa
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fossa:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
