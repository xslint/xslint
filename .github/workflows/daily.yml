---
# yamllint disable rule:line-length
name: daily
'on':
  schedule:
    - cron: '30 1 * * *'
jobs:
  build:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ windows-2022, ubuntu-24.04, macos-15 ]
        node: [ 20, 22 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm install --force -g grunt-cli
      - run: npm test
  audit:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit the tree, and say which of the two it read
        run: |
          set -e
          judged=2
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "::notice::the registry answered nothing, asking again"
              sleep 20
            fi
            npm audit --json > audit.json || true
            judged=0
            node scripts/audit.js audit.json || judged=$?
            if [ "$judged" -ne 2 ]; then
              break
            fi
          done
          if [ "$judged" -eq 2 ]; then
            {
              echo "### npm audit"
              echo ""
              echo "The registry answered nothing in three attempts, so this"
              echo "tree went unaudited tonight."
            } >> "$GITHUB_STEP_SUMMARY"
            judged=0
          fi
          exit "$judged"
  report-fail:
    name: Create issue on failure
    needs: [ build, audit ]
    if: failure() && github.event.pull_request == null
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: jayqi/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: daily failed
