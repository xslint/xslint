---
xpath: >-
  //xsl:param[some $sibling in preceding-sibling::xsl:param satisfies
  xslint:name($sibling, 'name') = xslint:name(., 'name') and
  not(xslint:conditional($sibling) or xslint:conditional(.))]
severity: error
message: Two xsl:param siblings share a @name. Each parameter of a template, function, or stylesheet must have a distinct name.
