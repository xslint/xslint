---
xpath: "//(xsl:variable | xsl:param | xsl:template | xsl:function)[matches(@name, '^(Q[{][^}]*[}]|[^:{]*:)?[0-9]')]"
severity: error
preset: recommended
message: A variable, parameter, function, or template name starts with a digit, so no processor loads this stylesheet. Rename it to start with a letter.
