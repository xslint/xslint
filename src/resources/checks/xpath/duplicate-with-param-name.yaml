---
xpath: >-
  //xsl:with-param[some $sibling in preceding-sibling::xsl:with-param satisfies
  xslint:attribute($sibling, 'name') = xslint:attribute(., 'name') and
  not(xslint:conditional($sibling) or xslint:conditional(.))]
severity: error
preset: recommended
message: A single call passes two xsl:with-param with the same @name. Each parameter can be supplied only once.
