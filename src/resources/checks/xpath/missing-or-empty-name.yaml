---
xpath: "//(xsl:variable | xsl:param | xsl:call-template | xsl:function | xsl:key | xsl:attribute-set | xsl:character-map | xsl:accumulator | xsl:element | xsl:attribute | xsl:processing-instruction | xsl:namespace)[not(@name) and not(@_name)] | //(xsl:variable | xsl:param | xsl:with-param | xsl:call-template | xsl:template | xsl:function | xsl:key | xsl:attribute-set | xsl:decimal-format | xsl:character-map | xsl:mode | xsl:accumulator | xsl:element | xsl:attribute | xsl:processing-instruction | xsl:namespace)[xslint:attribute(., 'name') = '']"
severity: error
preset: recommended
message: "The @name is missing or empty, so it holds no QName and no processor will load this stylesheet. Give it a name."
