---
xpath: "//xsl:with-param[not(parent::xsl:call-template or parent::xsl:apply-templates or parent::xsl:apply-imports or parent::xsl:next-match or parent::xsl:next-iteration or parent::xsl:evaluate)] | //xsl:with-param[parent::xsl:apply-imports][xslint:version(.) < 2.0]"
severity: error
preset: recommended
message: xsl:with-param stands under an element taking no parameters at the version in force, which a processor of that version refuses. Move it into a call, or raise the version.
