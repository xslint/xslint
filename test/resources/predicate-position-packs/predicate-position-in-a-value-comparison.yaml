---
pack: predicate-position-literal
# `[position() eq 1]` selects the node `[1]` selects, both comparing two
# integers, so the word spelling is the same smell as the symbol one and was
# never reported (#575). The predicate of a `match` pattern counts as much as
# one in a `select`, the padded spelling is reported where its comparison
# stands rather than where the bracket opens, and a predicate asking anything
# else — an inequality, an ordering, a string — is left alone.
found:
  amount: 6
  positions:
    - [ 3, 28 ]
    - [ 4, 32 ]
    - [ 5, 30 ]
    - [ 6, 29 ]
    - [ 6, 48 ]
    - [ 6, 67 ]
  fixes: [ "1", "last()", "1", "1", "2", "last()" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="s">
    <xsl:template match="row[position() eq 1]">
      <xsl:value-of select="cell[last() eq position()]"/>
      <xsl:value-of select="a[ position() = 1 ]"/>
      <xsl:value-of select="b[position() eq 1]/c[position() eq 2]/d[position() eq last()]"/>
      <xsl:value-of select="e[position() ne 1]"/>
      <xsl:value-of select="f[position() lt 1]"/>
      <xsl:value-of select="g[position() = 'x']"/>
    </xsl:template>
  </xsl:stylesheet>
