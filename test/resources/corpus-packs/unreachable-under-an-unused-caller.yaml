input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:my="urn:my" version="2.0">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:function name="my:bytes-to-string" as="xs:string">
      <xsl:param name="bytes" as="xs:string"/>
      <xsl:sequence select="my:hex-to-utf8(my:int-to-hex(string-length($bytes)))"/>
    </xsl:function>
    <xsl:function name="my:int-to-hex" as="xs:string">
      <xsl:param name="number" as="xs:integer"/>
      <xsl:sequence select="string($number)"/>
    </xsl:function>
    <xsl:function name="my:hex-to-utf8" as="xs:string">
      <xsl:param name="hex" as="xs:string"/>
      <xsl:sequence select="upper-case($hex)"/>
    </xsl:function>
    <xsl:template match="/">
      <xsl:copy-of select="."/>
    </xsl:template>
  </xsl:stylesheet>
