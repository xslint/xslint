---
pack: unused-named-template
found:
  amount: 3
  positions: [ [ 0, 3, 3 ], [ 0, 11, 3 ], [ 0, 14, 3 ] ]
inputs:
  - |-
    <?xml version="1.0"?>
    <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="1.0">
      <xsl:template name="spin">
        <xsl:param name="times"/>
        <xsl:if test="$times &gt; 0">
          <xsl:call-template name="spin">
            <xsl:with-param name="times" select="$times - 1"/>
          </xsl:call-template>
        </xsl:if>
      </xsl:template>
      <xsl:template name="even">
        <xsl:call-template name="odd"/>
      </xsl:template>
      <xsl:template name="odd">
        <xsl:call-template name="even"/>
      </xsl:template>
    </xsl:stylesheet>
