---
pack: unused-function
found:
  amount: 0
  positions: [ ]
inputs:
  - |-
    <?xml version="1.0"?>
    <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:f="urn:f" version="3.0">
      <xsl:function name="f:twice">
        <xsl:param name="number"/>
        <xsl:sequence select="$number * 2"/>
      </xsl:function>
      <xsl:function name="f:thrice">
        <xsl:param name="number"/>
        <xsl:sequence select="$number * 3"/>
      </xsl:function>
      <xsl:template match="/">
        <xsl:value-of select="f:twice(1, 2) +"/>
        <xsl:value-of select="Q{urn:f}thrice() +"/>
      </xsl:template>
    </xsl:stylesheet>
