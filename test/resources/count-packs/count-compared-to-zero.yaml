  fixes: [ "exists(x)", "empty(x)", "exists(x)", "empty(x)", "exists(x)", "empty(x)", "exists(para)", "empty(concat(@a, @b))" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="s">
