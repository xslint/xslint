      <xsl:variable name="d" select="count(x) &lt;= 0"/>
      <xsl:variable name="e" select="count(x) &gt;= 1"/>
      <xsl:variable name="f" select="count(x) &lt; 1"/>
    </xsl:template>
    <xsl:template match="section[count(para) &gt; 0]">
      <hit/>
    </xsl:template>
    <xsl:template match="row[count(concat(@a, @b)) = 0]">
      <hit/>
    </xsl:template>
  </xsl:stylesheet>
