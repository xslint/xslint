---
pack: count-compared-to-zero
# One argument holding two bindings, whose commas stand at bracket depth zero. A
# count of them read the clause as several arguments and fell silent on a
# construct it had reported and fixed correctly before; the parse separates
# arguments rather than counting brackets, so the commas that bind are no
# separators (#576). `BINDINGS` in test/expressions.test.js pinned the gap
# while a check still counted them, and went with `lone` and the last of those
# checks in #596; a pack of each is what pins the construct now.
found:
  amount: 2
  positions: [ [ 4, 19 ], [ 5, 29 ] ]
  fixes: [ "empty(for $va in a, $vb in b return $va)", "exists(some $va in a, $vb in b satisfies $va)" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="s">
    <xsl:template match="/">
      <xsl:if test="count(for $va in a, $vb in b return $va) = 0">
        <xsl:value-of select="count(some $va in a, $vb in b satisfies $va) &gt; 0"/>
      </xsl:if>
    </xsl:template>
  </xsl:stylesheet>
