---
pack: count-compared-to-zero
# An entity brings the expression its markup carries, so the comparison is
# reported where the reference stands. No fix is offered there: the source
# spells `&count;` at that place, and a replacement written into it would
# land on the ampersand rather than on the comparison it rewrites.
found:
  amount: 1
  positions: [ [ 10, 40 ] ]
  fixes: [ null ]
input: |-
  <?xml version="1.0"?>
  <!DOCTYPE xsl:stylesheet [
  <!ENTITY count "<xsl:value-of xmlns:xsl='http://www.w3.org/1999/XSL/Transform' select='count(alpha) &gt; 0'/>">
  ]>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="style1">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template match="/objects/o">
      <xsl:copy-of select="beta"/>
    </xsl:template>
    <xsl:template match="/objects/gamma">&count;</xsl:template>
  </xsl:stylesheet>
