---
pack: invalid-xpath-expression
# XSLT spells `use-when` twice, and the second spelling is the only one a
# literal result element has: unprefixed the attribute belongs to an XSLT
# element, and namespaced it stands on an element of the result vocabulary,
# which is how a simplified stylesheet carries one at all. Both hold a static
# expression a processor evaluates before it transforms anything, so a malformed
# one is a stylesheet that will not load — and the prefixed spelling reached
# neither the validator nor any check until #654, the derivation asking for an
# unprefixed name on an XSLT element and finding neither half of it here.
found:
  amount: 2
  positions: [ [ 3, 40 ], [ 4, 28 ] ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="s">
    <xsl:template match="/" use-when="1 +">
      <html xsl:use-when="2 *">text</html>
    </xsl:template>
  </xsl:stylesheet>
