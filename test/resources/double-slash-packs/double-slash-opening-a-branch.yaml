---
pack: starts-with-double-slash
# A branch of a union is matched exactly as a whole pattern is, so a `//`
# opening one is the same redundancy — including a branch of the pattern a
# bracket holds. The `//` of the union inside a predicate opens no branch: that
# is an expression, and there the leading `//` really does scan the document
# (#586).
