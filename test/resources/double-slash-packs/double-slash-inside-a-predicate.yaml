pack: use-double-slash
# A predicate holds an expression, not a step of the pattern's path, and an
# expression's inner `//` answers to no check of ours: `select="nu//xi"` draws
# nothing, where the same text under a `@match` drew this one (#948). So the
# three buried in one predicate go unreported, the one a nested predicate holds
# with them, and the `nu//xi` standing beside the `lambda//mu` that is reported.
# What survives is the pattern's own separator, and the `//` that *opens* a path
# a predicate holds — which scans the document from the root once per candidate,
# so it answers to the check named for that and not to this one (#970). The last
# row is where a predicate ends: the
# `//` behind the `]` is the pattern's own, so the extent a predicate covers is
# read up to its closing bracket and never over it.
found:
  amount: 3
  positions: [ [ 10, 30 ], [ 13, 42, scans-whole-document ], [ 14, 34 ] ]
  fixes: [ null, null, null ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="style1">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template match="alpha[beta//gamma and delta//epsilon or not(.//zeta)]">
      <xsl:copy-of select="."/>
    </xsl:template>
    <xsl:template match="eta[theta[iota//kappa]]">
      <xsl:copy-of select="."/>
    </xsl:template>
    <xsl:template match="lambda//mu[nu//xi]">
      <xsl:copy-of select="."/>
    </xsl:template>
    <xsl:key name="kk" match="omicron[pi | //rho]" use="@id"/>
    <xsl:template match="sigma[tau]//upsilon">
      <xsl:copy-of select="."/>
    </xsl:template>
  </xsl:stylesheet>
