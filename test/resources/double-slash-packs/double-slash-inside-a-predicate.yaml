pack: use-double-slash
# A predicate holds an expression, not a step of the pattern's path, and an
# expression's inner `//` answers to no check of ours: `select="nu//xi"` draws
# nothing, where the same text under a `@match` drew this one (#948). So the
# three buried in one predicate go unreported, the one a nested predicate holds
# with them, and the `nu//xi` standing beside the `lambda//mu` that is reported.
# What survives is the pattern's own separator, and the `//` that *opens* a path
# a predicate holds, which scans the document from the root once per candidate
# and is the case #586 put here.
