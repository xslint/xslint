  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="style1">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template match="alpha[beta//gamma and delta//epsilon or not(.//zeta)]">
      <xsl:copy-of select="."/>
    </xsl:template>
    <xsl:template match="eta[theta[iota//kappa]]">
      <xsl:copy-of select="."/>
    </xsl:template>
    <xsl:template match="lambda//mu[nu//xi]">
      <xsl:copy-of select="."/>
    </xsl:template>
    <xsl:key name="kk" match="omicron[pi | //rho]" use="@id"/>
