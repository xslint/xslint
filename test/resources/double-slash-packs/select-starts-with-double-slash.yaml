    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template match="/objects/o">
      <xsl:copy-of select="//title"/>
      <xsl:copy-of select=" //spaced"/>
      <xsl:copy-of select="(: note :)//commented"/>
