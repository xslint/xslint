# A predicate holds an expression, evaluated forwards, so a `//` opening a path
# there walks the document from its root once for every node the pattern is
# tested against — the construct the expression side is named for, and not the
# breadth the pattern's own steps are about (#970). Three in one predicate, two
# of them buried in a call, and a branch of a union is the fourth shape. What
# opens no path from the root stays quiet: `.//lambda` descends from the node in
# hand and `mu//nu` from a step, exactly as they do under a `select`.
