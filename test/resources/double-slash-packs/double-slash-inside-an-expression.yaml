# A `//` opening a sub-expression walks the same tree as one opening the whole
# of it, so where the slashes stand inside the parse decides nothing. What does
# decide it is whether they open a path: `items//item` descends from a step the
# context node supplies, `$root//node` from a binding, and `'//literal'` is a
# string.
