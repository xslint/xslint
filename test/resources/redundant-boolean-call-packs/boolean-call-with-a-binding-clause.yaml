---
pack: redundant-boolean-call
# One argument holding two bindings, whose commas stand at bracket depth zero. A
# count of them read the clause as several arguments and fell silent on a wrapper
# it would otherwise strip correctly; the parse separates arguments rather than
# counting brackets, so the commas that bind are no separators (#561, #576).
# `BINDINGS` in test/expressions.test.js pinned the gap while a check still
# counted them, and went with `lone` in #596.
found:
  amount: 2
  positions: [ [ 4, 19 ], [ 5, 36 ] ]
  fixes: [ "for $va in a, $vb in b return $va", "(some $va in a, $vb in b satisfies $va)" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="s">
    <xsl:template match="/">
      <xsl:if test="boolean(for $va in a, $vb in b return $va)">
        <xsl:value-of select="@z and boolean(some $va in a, $vb in b satisfies $va)"/>
      </xsl:if>
    </xsl:template>
  </xsl:stylesheet>
