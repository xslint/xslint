---
pack: redundant-boolean-call
# A wrapper adds nothing wherever only the effective boolean value of what stands
# there is taken: a whole `@test`, an operand of `and` or `or`, the argument of
# `not()` or of another `boolean()`, the condition of an `if`, the body of a
# `satisfies`. The argument stands in its place, bracketed where it binds loosely
# enough for the operator around it to regroup. A bracket of the author's own is
# transparent, and only where it stands in such a place itself. A predicate is no
# such place — a number there is a position rather than a truth — and neither is
# an operand of a comparison, which compares the values themselves, nor a binding
# of a quantifier, nor an arm of an `if`. Nor is the argument of a call that
# only reads like one of those two: `string()` prints the truth rather than
# taking it, and a `not()` holding two arguments is no `fn:not` at all (#561).
found:
  amount: 11
  positions: [ [ 4, 23 ], [ 5, 29 ], [ 6, 35 ], [ 7, 29 ], [ 7, 45 ], [ 7, 61 ], [ 8, 37 ], [ 9, 36 ], [ 10, 33 ], [ 11, 54 ], [ 14, 22 ] ]
  fixes: [ "@x", "@a", "@d", "@e", "@f", "@g", "@h", "(@j or @k)", "@l", "$va/@m", "@q" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="s">
    <xsl:template match="/">
      <xsl:if test="not(boolean(@x))">
        <xsl:value-of select="boolean(@a) and @b"/>
        <xsl:value-of select="@c or boolean(@d)"/>
        <xsl:value-of select="boolean(@e) and boolean(@f) and boolean(@g)"/>
        <xsl:value-of select="boolean(boolean(@h))"/>
        <xsl:value-of select="@i and boolean(@j or @k)"/>
        <xsl:value-of select="if (boolean(@l)) then 'y' else 'n'"/>
        <xsl:value-of select="every $va in a satisfies boolean($va/@m)"/>
        <xsl:value-of select="item[boolean(@n)]/name"/>
        <xsl:value-of select="@o = boolean(@p)"/>
        <xsl:if test="(boolean(@q))">
          <xsl:value-of select="(boolean(@r))"/>
          <xsl:value-of select="every $va in boolean(@s) satisfies $va"/>
          <xsl:value-of select="if (@t) then boolean(@u) else 'n'"/>
          <xsl:value-of select="not(boolean(@v), @w)"/>
          <xsl:value-of select="string(boolean(@y))"/>
        </xsl:if>
      </xsl:if>
    </xsl:template>
  </xsl:stylesheet>
