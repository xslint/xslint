---
pack: redundant-double-negation
# A whole `use-when` takes a truth and nothing else, exactly as a whole `@test`
# does, so the negations there reduce to their argument bare while the same
# construct in a `select` reduces to `boolean(...)` — one construct, two
# equivalents, decided by the attribute holding it. The `xsl:use-when` a literal
# result element carries is an XPath attribute outside the XSLT namespace, so it
# reaches no code-based check at all (#596, #561).
found:
  amount: 2
  positions: [ [ 3, 37 ], [ 5, 29 ] ]
  fixes: [ "system-property('xsl:version')", "boolean(@a)" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="s">
    <xsl:template match="/" use-when="not(not(system-property('xsl:version')))">
      <p xsl:use-when="not(not(system-property('xsl:version')))">
        <xsl:value-of select="not(not(@a))"/>
      </p>
    </xsl:template>
  </xsl:stylesheet>
