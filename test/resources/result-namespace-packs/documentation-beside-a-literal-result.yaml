---
pack: leaking-result-namespace
# Top-level data stays out of the result, while a literal result element in a
# template still carries every prefix in scope onto the output (#1006).
found:
  amount: 1
  positions: [ [ 2, 66 ] ]
  fixes: [ "doc xs" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:doc="http://www.oxygenxml.com/ns/doc/xsl" exclude-result-prefixes="doc" version="2.0">
    <doc:doc scope="stylesheet">
      <doc:p>Counts the objects</doc:p>
    </doc:doc>
    <xsl:template match="/">
      <total>
        <xsl:value-of select="count(*) cast as xs:integer"/>
      </total>
    </xsl:template>
  </xsl:stylesheet>
