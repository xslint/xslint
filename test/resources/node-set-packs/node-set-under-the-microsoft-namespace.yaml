---
pack: use-node-set-extension
# The other namespace the function is spelled in: MSXSL declares its own
# `node-set` for exactly what EXSLT's does, and a 2.0 processor makes both
# unnecessary the same way.
found:
  amount: 1
  positions: [ [ 4, 27 ] ]
  fixes: [ "$v" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:msxsl="urn:schemas-microsoft-com:xslt" version="2.0">
    <xsl:template match="/">
      <xsl:value-of select="msxsl:node-set($v)/alpha"/>
    </xsl:template>
  </xsl:stylesheet>
