---
pack: string-length-compared-to-zero
# Neither the construct nor its rewrite is version-dependent, so a 1.0
# stylesheet is read exactly as a 2.0 one is (#578).
found:
  amount: 2
  positions: [ [ 4, 36 ], [ 5, 36 ] ]
  fixes: [ "@x = ''", "@y != ''" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="1.0" id="s">
    <xsl:template match="/">
      <xsl:variable name="a" select="string-length(@x) = 0"/>
      <xsl:variable name="b" select="0 &lt; string-length(@y)"/>
    </xsl:template>
  </xsl:stylesheet>
