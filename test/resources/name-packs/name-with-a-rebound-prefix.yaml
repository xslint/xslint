---
pack: name-compared-to-string
# What tells the standard call from a user function of the same local name is
# the namespace the prefix resolves to, never the prefix: `fn` bound to a
# vocabulary of your own names your function, and rewriting the comparison to
# `self::p` would answer a question it never asked. The same holds one step
# further in: an inline `Q{...}` naming a vocabulary of your own is a foreign
# function too, and the scan read it as the bare spelling, the `}` in front of
# the name being no letter (#598, #577).
found:
  amount: 0
  positions: [  ]
  fixes: [  ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:fn="urn:mine" version="3.0" id="s">
    <xsl:template match="/">
      <xsl:variable name="a" select="fn:name() = 'p'"/>
      <xsl:variable name="b" select="fn:local-name() != 'q'"/>
      <xsl:variable name="c" select="Q{urn:mine}name() = 'p'"/>
    </xsl:template>
  </xsl:stylesheet>
