---
# `name()` answers the bare local name of an element in a default namespace,
# where an unprefixed `self::` step names no namespace at all, so the advice is
# the wildcard — unless `xpath-default-namespace` puts the bare step in one,
# a nearer empty one taking it back out (#1000).
pack: name-compared-to-string
found:
  amount: 5
  positions: [ [ 4, 19 ], [ 5, 19 ], [ 8, 19 ], [ 10, 21 ], [ 14, 19 ] ]
  fixes: [ "not(self::*:pubdate)", "self::d:pubdate", "self::title", "self::*:note", "self::*:para" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:d="urn:d" version="2.0" id="s">
    <xsl:template match="d:pubdate">
      <xsl:if test="name(.) != 'pubdate'"/>
      <xsl:if test="name() = 'd:pubdate'"/>
    </xsl:template>
    <xsl:template match="*" xpath-default-namespace="urn:d">
      <xsl:if test="name() = 'title'"/>
      <xsl:for-each select="*" xpath-default-namespace="">
        <xsl:if test="name() = 'note'"/>
      </xsl:for-each>
    </xsl:template>
    <xsl:template match="*">
      <xsl:if test="name() = 'para'"/>
    </xsl:template>
  </xsl:stylesheet>
