  positions: [ [ 4, 36 ], [ 5, 36 ], [ 6, 36 ], [ 7, 36 ], [ 9, 26 ] ]
  fixes: [ "self::*:p", "not(self::*:q)", "self::*:r", "self::*:s", "self::*:t" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="s">
