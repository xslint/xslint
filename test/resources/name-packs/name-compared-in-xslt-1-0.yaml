---
# A prefixed `name()` reports and rewrites at 1.0, the prefix naming the
# namespace a node test asks for. The two halves beside it draw nothing: an
# unprefixed `name()` answers the bare name of an element in a default
# namespace too, which only the `*:name` wildcard spells, and 1.0 has none —
# no more than it has one for `local-name()` (#962, #1000).
pack: name-compared-to-string
found:
  amount: 1
  positions: [ [ 4, 36 ] ]
  fixes: [ "self::t:p" ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" xmlns:t="urn:t" version="1.0" id="s">
    <xsl:template match="/">
      <xsl:variable name="a" select="name() = 't:p'"/>
      <xsl:variable name="b" select="local-name() = 'r'"/>
      <xsl:variable name="c" select="name() = 'q'"/>
    </xsl:template>
  </xsl:stylesheet>
