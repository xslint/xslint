    </xsl:function>
    <xsl:key name="cantor" match="o" use="@id"/>
    <xsl:attribute-set name="dedekind"/>
    <xsl:decimal-format name="peano"/>
    <xsl:character-map name="cauchy"/>
    <xsl:mode name="fourier"/>
