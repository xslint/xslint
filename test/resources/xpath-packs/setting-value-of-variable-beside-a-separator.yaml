---
pack: setting-value-of-variable-incorrectly
found:
  amount: 0
  positions: [ ]
input: |-
  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="3.0" id="style1">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template match="list">
      <xsl:variable name="joined">
        <xsl:value-of select="item" separator=","/>
      </xsl:variable>
      <xsl:variable name="shadowed">
        <xsl:value-of select="item" _separator="{'; '}"/>
      </xsl:variable>
      <xsl:value-of select="$joined, $shadowed"/>
    </xsl:template>
  </xsl:stylesheet>
