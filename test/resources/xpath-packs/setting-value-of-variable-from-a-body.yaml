  <?xml version="1.0"?>
  <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="2.0" id="style1">
    <xsl:output encoding="UTF-8" method="xml"/>
    <xsl:template name="suffix">
      <xsl:text>-end</xsl:text>
    </xsl:template>
    <xsl:template match="entry">
      <xsl:variable name="pattern">
        <xsl:value-of>
          <xsl:text>\s+[a-z]</xsl:text>
        </xsl:value-of>
      </xsl:variable>
      <xsl:variable name="called">
        <xsl:value-of>
          <xsl:call-template name="suffix"/>
        </xsl:value-of>
      </xsl:variable>
      <xsl:value-of select="$pattern, $called"/>
    </xsl:template>
  </xsl:stylesheet>
